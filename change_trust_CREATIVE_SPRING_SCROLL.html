<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANGE Trust — Centre for Health & Gender Equality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   CHANGE Trust — Design System
   Palette from the org seal: forest green, deep cobalt, warm
   magenta, on paper white. Fraunces for display, Hanken
   Grotesk for body text.
   =========================================================== */
:root {
  --forest:       #1a6b3c;
  --forest-deep:  #0f4a28;
  --cobalt:       #1d4ed8;
  --cobalt-deep:  #15369e;
  --magenta:      #c4267a;
  --paper:        #faf8f3;
  --paper-warm:   #f3eee2;
  --ink:          #1c1f1a;
  --ink-soft:     #4a4f47;
  --line:         #e2dccb;
  --lime:         #b8d94a;
  --font-display: 'Fraunces', serif;
  --font-body: 'Hanken Grotesk', sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin:0; font-family: var(--font-body); background: var(--paper); color: var(--ink); line-height:1.6; }
img { max-width:100%; display:block; }
a { color: var(--cobalt-deep); text-decoration: none; cursor:pointer; }
a:hover { text-decoration: underline; }
h1,h2,h3,h4 { font-family: var(--font-display); font-weight:600; line-height:1.15; margin:0 0 0.5em; color: var(--forest-deep); }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight:700; }
h2 { font-size: clamp(1.6rem, 3.2vw, 2.4rem); }
h3 { font-size: 1.3rem; }
p { margin:0 0 1em; color: var(--ink-soft); }
.container { max-width:1140px; margin:0 auto; padding:0 24px; }
button { font-family: var(--font-body); }

.btn { display:inline-flex; align-items:center; gap:8px; padding:12px 26px; border-radius:100px; font-weight:600; font-size:0.95rem; border:2px solid transparent; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease; text-decoration:none; }
.btn:hover { text-decoration:none; transform: translateY(-1px); }
.btn-primary { background: var(--forest); color:#fff; }
.btn-primary:hover { background: var(--forest-deep); box-shadow: 0 6px 16px rgba(26,107,60,.25); }
.btn-outline { background:transparent; border-color: var(--forest); color: var(--forest-deep); }
.btn-outline:hover { background: var(--forest); color:#fff; }
.btn-magenta { background: var(--magenta); color:#fff; }
.btn-magenta:hover { background:#a31d63; }
.btn-block { width:100%; justify-content:center; }
.btn-sm { padding:8px 16px; font-size:.85rem; }
.btn-danger { background:#b3261e; color:#fff; }
.btn-secondary { background: var(--paper-warm); color: var(--ink); border-color: var(--line); }

.navbar { position:sticky; top:0; z-index:100; background:rgba(250,248,243,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.navbar .container { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; }
.nav-brand { display:flex; align-items:center; gap:12px; font-family: var(--font-display); font-weight:700; font-size:1.15rem; color: var(--forest-deep); cursor:pointer; }
.nav-brand .logo-seal { height:46px; width:46px; border-radius:50%; flex-shrink:0; }
.nav-brand .brand-sub { display:block; font-family: var(--font-body); font-weight:500; font-size:.7rem; color: var(--ink-soft); letter-spacing:.04em; }
.nav-links { display:flex; align-items:center; gap:28px; list-style:none; margin:0; padding:0; }
.nav-links a { color: var(--ink); font-weight:600; font-size:.95rem; }
.nav-links a.active { color: var(--forest-deep); }
.nav-toggle { display:none; background:none; border:none; font-size:1.6rem; cursor:pointer; color: var(--forest-deep); }
@media (max-width:860px) {
  .nav-links { position:fixed; top:74px; left:0; right:0; background:var(--paper); flex-direction:column; align-items:flex-start; gap:18px; padding:24px; border-bottom:1px solid var(--line); transform:translateY(-110%); transition:transform .25s ease; }
  .nav-links.open { transform:translateY(0); }
  .nav-toggle { display:block; }
}

.hero { position:relative; padding:90px 0 70px; overflow:hidden; background: radial-gradient(circle at 85% 15%, rgba(196,38,122,.10), transparent 45%), radial-gradient(circle at 10% 85%, rgba(29,78,216,.10), transparent 45%), var(--paper); }
.hero-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:center; }
.hero-eyebrow { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color: var(--forest-deep); background:rgba(26,107,60,.08); padding:6px 14px; border-radius:100px; margin-bottom:18px; }
.hero h1 { margin-bottom:.3em; }
.hero .tagline-word { color: var(--magenta); }
.hero-lead { font-size:1.15rem; max-width:480px; }
.hero-ctas { display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; }
.hero-stats { display:flex; gap:32px; margin-top:44px; flex-wrap:wrap; }
.hero-stat .num { font-family: var(--font-display); font-size:2.1rem; font-weight:700; color: var(--forest-deep); }
.hero-stat .label { font-size:.85rem; color: var(--ink-soft); }
.hero-visual { position:relative; display:flex; align-items:center; justify-content:center; }
.seal-ring { position:relative; width:320px; height:320px; }
.seal-ring img { width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 18px 40px rgba(26,107,60,.18)); }
.seal-ring::before { content:""; position:absolute; inset:-30px; border-radius:50%; border:2px dashed rgba(196,38,122,.25); animation:spin 40s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:860px) { .hero-grid { grid-template-columns:1fr; } .hero-visual { order:-1; } .seal-ring { width:220px; height:220px; } }

.section { padding:70px 0; }
.section-alt { background: var(--paper-warm); }
.section-head { max-width:640px; margin-bottom:44px; }
.eyebrow { font-weight:700; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color: var(--magenta); margin-bottom:10px; display:block; }

.program-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:22px; }
.program-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; transition: transform .2s ease, box-shadow .2s ease; }
.program-card:hover { transform:translateY(-4px); box-shadow:0 14px 30px rgba(26,42,26,.08); }
.program-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--forest), var(--cobalt)); color:#fff; margin-bottom:16px; font-size:1.3rem; }
.program-card h3 { margin-bottom:8px; font-size:1.1rem; }
.program-card p { font-size:.92rem; margin:0; }

.profile-table { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
.profile-table tr { border-bottom:1px solid var(--line); }
.profile-table tr:last-child { border-bottom:none; }
.profile-table td { padding:14px 18px; vertical-align:top; font-size:.95rem; }
.profile-table td:first-child { font-weight:700; color: var(--forest-deep); width:220px; background: var(--paper-warm); }
.stat-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:30px 0; }
.stat-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; text-align:center; }
.stat-card .year { font-size:.8rem; color: var(--ink-soft); font-weight:600; }
.stat-card .value { font-family: var(--font-display); font-size:1.6rem; color: var(--forest-deep); font-weight:700; }
.pill-list { display:flex; flex-wrap:wrap; gap:10px; }
.pill { background: var(--paper-warm); border:1px solid var(--line); border-radius:100px; padding:7px 16px; font-size:.85rem; font-weight:600; color: var(--forest-deep); }

.location-grid { display:grid; grid-template-columns:1fr 1fr; gap:36px; align-items:start; }
.map-frame { border-radius:18px; overflow:hidden; border:1px solid var(--line); height:420px; }
.map-frame iframe { width:100%; height:100%; border:0; }
.address-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; }
.address-card .row { display:flex; gap:14px; margin-bottom:18px; }
.address-card .row .ic { color: var(--magenta); flex-shrink:0; margin-top:3px; }
@media (max-width:860px) { .location-grid { grid-template-columns:1fr; } .map-frame { height:300px; } }

.feature-list { display:grid; gap:18px; }
.feature-item { display:flex; gap:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
.feature-item .ic { width:40px; height:40px; border-radius:10px; background: var(--paper-warm); color: var(--forest); display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; }
.form-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-weight:600; font-size:.88rem; margin-bottom:6px; color: var(--forest-deep); }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; font-family: var(--font-body); font-size:.95rem; background: var(--paper); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color: var(--forest); box-shadow:0 0 0 3px rgba(26,107,60,.12); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:860px) { .contact-grid { grid-template-columns:1fr; } .form-row { grid-template-columns:1fr; } }
.alert { padding:14px 18px; border-radius:10px; margin-bottom:20px; font-weight:600; font-size:.9rem; }
.alert-success { background:#e3f5e9; color: var(--forest-deep); border:1px solid #b6e3c5; }
.alert-error { background:#fbe5e3; color:#8c2a20; border:1px solid #f0bdb6; }

.site-footer { background: var(--forest-deep); color:#e9efe7; padding:56px 0 28px; margin-top:40px; }
.footer-grid { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:40px; }
.footer-grid h4 { color:#fff; font-size:1rem; margin-bottom:16px; }
.site-footer p { color:#c3d2c0; font-size:.9rem; }
.site-footer a { color:#d9e6d6; }
.footer-links { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
.footer-bottom { border-top:1px solid rgba(255,255,255,.12); margin-top:40px; padding-top:22px; text-align:center; font-size:.82rem; color:#9ab197; }
.social-row { display:flex; gap:12px; margin-top:16px; }
.social-row a { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; color:#fff; }
.social-row a:hover { background: var(--magenta); text-decoration:none; }
@media (max-width:860px) { .footer-grid { grid-template-columns:1fr; } }

.error-page { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 24px; }

/* ===== Admin ===== */
.admin-body { background:#f4f6f3; }
.admin-shell { display:flex; min-height:100vh; }
.admin-sidebar { width:240px; background: var(--forest-deep); color:#e9efe7; flex-shrink:0; display:flex; flex-direction:column; padding:24px 0; }
.admin-sidebar .brand { display:flex; align-items:center; gap:10px; padding:0 20px 24px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:20px; }
.admin-sidebar .brand img { width:38px; height:38px; border-radius:50%; }
.admin-sidebar .brand span { font-family: var(--font-display); font-weight:700; font-size:1rem; }
.admin-nav { list-style:none; padding:0; margin:0; flex:1; }
.admin-nav a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:#cfe0cc; font-weight:600; font-size:.92rem; text-decoration:none; border-left:3px solid transparent; }
.admin-nav a:hover, .admin-nav a.active { background:rgba(255,255,255,.08); color:#fff; border-left-color: var(--lime); }
.admin-sidebar .logout-area { padding:16px 20px 0; border-top:1px solid rgba(255,255,255,.1); }
.admin-main { flex:1; padding:32px 36px; max-width:1200px; }
.admin-topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
.admin-topbar h1 { font-size:1.6rem; margin:0; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:18px; margin-bottom:32px; }
.kpi-card { background:#fff; border-radius:14px; padding:22px; border:1px solid #e3e8e1; }
.kpi-card .kpi-value { font-family: var(--font-display); font-size:2rem; font-weight:700; color: var(--forest-deep); }
.kpi-card .kpi-label { font-size:.85rem; color: var(--ink-soft); font-weight:600; }
.card { background:#fff; border-radius:14px; border:1px solid #e3e8e1; padding:24px; margin-bottom:24px; }
.card h2, .card h3 { margin-top:0; }
table.data-table { width:100%; border-collapse:collapse; }
table.data-table th { text-align:left; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color: var(--ink-soft); padding:10px 12px; border-bottom:2px solid #e3e8e1; }
table.data-table td { padding:12px; border-bottom:1px solid #eef1ec; font-size:.92rem; vertical-align:middle; }
table.data-table tr:hover td { background:#fafbf9; }
.table-photo { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#e3e8e1; }
.badge { display:inline-block; padding:4px 10px; border-radius:100px; font-size:.75rem; font-weight:700; }
.badge-meal { background:#fef3c7; color:#92400e; }
.badge-medicine { background:#dbeafe; color:#1e40af; }
.badge-visit { background:#fce7f3; color:#9d174d; }
.badge-other { background:#e5e7eb; color:#374151; }
.search-box { display:flex; gap:10px; }
.search-box input { padding:10px 14px; border:1.5px solid #d8ded5; border-radius:10px; font-size:.9rem; min-width:240px; }
.login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg, var(--forest-deep), #0a3018); padding:24px; }
.login-card { background:#fff; border-radius:20px; padding:44px; width:100%; max-width:400px; box-shadow:0 30px 60px rgba(0,0,0,.3); text-align:center; }
.login-card img { width:70px; height:70px; margin:0 auto 16px; border-radius:50%; }
.login-card h1 { font-size:1.4rem; margin-bottom:4px; }
.login-card .sub { color: var(--ink-soft); font-size:.88rem; margin-bottom:28px; }
.profile-grid { display:grid; grid-template-columns:260px 1fr; gap:28px; }
.profile-photo-card { background:#fff; border:1px solid #e3e8e1; border-radius:14px; padding:20px; text-align:center; }
.profile-photo-card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:#f0f2ee; margin-bottom:14px; }
.profile-photo-card .name { font-family: var(--font-display); font-weight:700; font-size:1.2rem; color: var(--forest-deep); }
.profile-photo-card .meta { color: var(--ink-soft); font-size:.85rem; margin-bottom:16px; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.info-row { padding:10px 0; border-bottom:1px solid #eef1ec; }
.info-row.full { grid-column:span 2; }
.info-row .label { font-size:.75rem; text-transform:uppercase; color: var(--ink-soft); font-weight:700; letter-spacing:.03em; }
.info-row .value { font-size:.95rem; margin-top:2px; white-space:pre-wrap; }
.doc-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #eef1ec; gap:12px; }
.doc-row:last-child { border-bottom:none; }
.doc-row .doc-name { font-weight:600; }
.doc-row .doc-meta { font-size:.8rem; color: var(--ink-soft); }
.flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.text-muted { color: var(--ink-soft); font-size:.88rem; }
.empty-state { text-align:center; padding:48px 20px; color: var(--ink-soft); }
@media (max-width:900px) {
  .admin-shell { flex-direction:column; }
  .admin-sidebar { width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:12px; }
  .admin-sidebar .brand { display:none; }
  .admin-nav { display:flex; }
  .admin-main { padding:20px; }
  .profile-grid { grid-template-columns:1fr; }
  .info-grid { grid-template-columns:1fr; }
}
.hidden { display:none !important; }
.toast { position:fixed; bottom:24px; right:24px; background: var(--forest-deep); color:#fff; padding:14px 22px; border-radius:10px; font-weight:600; font-size:.9rem; box-shadow:0 10px 30px rgba(0,0,0,.2); z-index:1000; animation: fadein .2s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ---------- Database section modal ---------- */
.modal-backdrop { position:fixed; inset:0; background:rgba(15,40,20,.45); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal-backdrop.open { display:flex; }
.modal { background:#fff; border-radius:16px; max-width:620px; width:100%; max-height:88vh; overflow-y:auto; padding:28px; }
.modal-actions { display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }

/* ===========================================================
   CREATIVE THEME LAYER — spring / parallax / scroll-reveal
   Adds motion on top of the existing design system without
   touching any of the original selectors above.
   =========================================================== */
:root {
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out:    cubic-bezier(.16, 1, .3, 1);
  --shadow-soft: 0 24px 60px rgba(15, 74, 40, .12);
}

::selection { background: var(--lime); color: var(--forest-deep); }

#scrollProgress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--forest), var(--cobalt), var(--magenta));
  z-index: 1200; transition: width .12s linear; pointer-events: none;
}

/* ---- Page-enter swoosh whenever the SPA swaps routes ---- */
@keyframes pageEnter { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
#app.page-enter { animation: pageEnter .65s var(--ease-out); }

/* ---- Generic scroll-reveal, applied via JS to existing cards/sections ---- */
.reveal { opacity: 0; transform: translateY(52px) scale(.98); transition: opacity .9s var(--ease-spring), transform .9s var(--ease-spring); will-change: transform, opacity; }
.reveal.in-view { opacity: 1; transform: translateY(0) scale(1); }

/* ---- Navbar gains presence once the page scrolls ---- */
.navbar { transition: box-shadow .35s var(--ease-out), padding .35s var(--ease-out); }
.navbar.scrolled { box-shadow: 0 10px 30px rgba(15,40,20,.10); }
.navbar.scrolled .container { padding-top: 10px; padding-bottom: 10px; }
.nav-links a { position: relative; }
.nav-links a::after {
  content: ""; position: absolute; left:0; right:0; bottom:-6px; height:2px;
  background: var(--magenta); border-radius: 2px;
  transform: scaleX(0); transform-origin: left; transition: transform .4s var(--ease-spring);
}
.nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
.nav-brand .logo-seal { transition: transform .5s var(--ease-spring); }
.nav-brand:hover .logo-seal { transform: rotate(-8deg) scale(1.06); }

/* ---- Hero: floating gradient blobs + parallax seal ---- */
.hero { position: relative; }
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(70px);
  opacity: .45; z-index: 0; pointer-events: none; animation: heroFloat 11s ease-in-out infinite;
}
.hero::before { width: 300px; height: 300px; background: var(--lime); top: -100px; left: -90px; }
.hero::after  { width: 360px; height: 360px; background: var(--cobalt); bottom: -140px; right: -80px; animation-delay: -5.5s; }
@keyframes heroFloat { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(18px, -26px); } }
.hero-grid { position: relative; z-index: 1; }
.seal-ring { animation: sealFloat 6s ease-in-out infinite; }
@keyframes sealFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

/* ---- Springy buttons ---- */
.btn { transition: transform .3s var(--ease-spring), box-shadow .3s var(--ease-spring), background .2s ease; }
.btn:active { transform: scale(.94); }

/* ---- Cards lift with a touch of spring, not just linear ease ---- */
.program-card, .feature-item, .stat-card, .kpi-card, .card, .address-card, .form-card {
  transition: transform .45s var(--ease-spring), box-shadow .45s var(--ease-spring);
}
.program-card:hover, .kpi-card:hover, .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-soft); }
.program-icon { transition: transform .4s var(--ease-spring); }
.program-card:hover .program-icon { transform: rotate(-6deg) scale(1.08); }

/* ---- Admin nav gets a springy nudge + sliding accent ---- */
.admin-nav a { transition: background .3s var(--ease-out), border-color .3s var(--ease-spring), padding-left .3s var(--ease-spring); }
.admin-nav a:hover { padding-left: 26px; }

/* ---- Toast bounces in like a small spring ---- */
@keyframes fadein { 0% { opacity:0; transform: translateY(24px) scale(.92); } 60% { opacity:1; transform: translateY(-4px) scale(1.02); } 100% { transform: translateY(0) scale(1); } }
.toast { animation: fadein .55s var(--ease-spring); }

/* ---- Modal + login card pop in with spring ---- */
@keyframes modalPop { from { opacity:0; transform: scale(.9) translateY(14px); } to { opacity:1; transform: scale(1) translateY(0); } }
.modal { animation: modalPop .45s var(--ease-spring); }
.login-card { animation: modalPop .55s var(--ease-spring); }

/* ---- Pills / badges get a tiny spring hover ---- */
.pill, .badge { transition: transform .3s var(--ease-spring); }
.pill:hover { transform: translateY(-2px) scale(1.04); }

// ---------- IndexedDB setup ----------
const DB_NAME = 'changeTrustDB';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if (!_db.objectStoreNames.contains('residents')) {
        const store = _db.createObjectStore('residents', { keyPath: 'id', autoIncrement: true });
        store.createIndex('status', 'status');
      }
      if (!_db.objectStoreNames.contains('logs')) {
        const store = _db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
        store.createIndex('residentId', 'residentId');
      }
      if (!_db.objectStoreNames.contains('documents')) {
        const store = _db.createObjectStore('documents', { keyPath: 'id', autoIncrement: true });
        store.createIndex('residentId', 'residentId');
      }
      if (!_db.objectStoreNames.contains('messages')) {
        _db.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      }
      if (!_db.objectStoreNames.contains('settings')) {
        _db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}

function dbAdd(storeName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').add(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}
function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}
function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}
function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').delete(key);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}
function dbGetByIndex(storeName, indexName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).index(indexName).getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}


// ---------- Firebase cloud sync for ALL main application data ----------
const CLOUD_STORES = ['residents','logs','documents','messages','settings'];

function cloudSafeId(id) { return String(id); }

async function dbAdd(storeName, value) {
  // Use a globally unique numeric ID so records work across devices and existing onclick code.
  if (CLOUD_STORES.includes(storeName) && (value.id === undefined || value.id === null)) {
    value.id = Date.now() * 1000 + Math.floor(Math.random() * 1000);
  }
  try {
    if (CLOUD_STORES.includes(storeName) && window.cloudDB) {
      await window.cloudDB.collection('appData').doc(storeName).collection('items')
        .doc(cloudSafeId(value.id !== undefined ? value.id : value.key)).set(value);
      // Best-effort local cache.
      try { await new Promise((resolve,reject)=>{ const req=tx(storeName,'readwrite').put(value); req.onsuccess=()=>resolve(); req.onerror=reject; }); } catch(e){}
      return value.id !== undefined ? value.id : value.key;
    }
  } catch (e) { console.error('Cloud add failed:', storeName, e); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').add(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

async function dbPut(storeName, value) {
  try {
    if (CLOUD_STORES.includes(storeName) && window.cloudDB) {
      const key = value.id !== undefined ? value.id : value.key;
      await window.cloudDB.collection('appData').doc(storeName).collection('items')
        .doc(cloudSafeId(key)).set(value, {merge:false});
      try { await new Promise((resolve,reject)=>{ const req=tx(storeName,'readwrite').put(value); req.onsuccess=()=>resolve(); req.onerror=reject; }); } catch(e){}
      return key;
    }
  } catch (e) { console.error('Cloud save failed:', storeName, e); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

async function dbGet(storeName, key) {
  try {
    if (CLOUD_STORES.includes(storeName) && window.cloudDB) {
      const snap = await window.cloudDB.collection('appData').doc(storeName).collection('items').doc(cloudSafeId(key)).get();
      if (snap.exists) return snap.data();
    }
  } catch (e) { console.error('Cloud get failed:', storeName, e); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

async function dbGetAll(storeName) {
  try {
    if (CLOUD_STORES.includes(storeName) && window.cloudDB) {
      const snap = await window.cloudDB.collection('appData').doc(storeName).collection('items').get();
      const rows = snap.docs.map(d => d.data());
      // Refresh local cache.
      for (const row of rows) {
        try { await new Promise((resolve,reject)=>{ const req=tx(storeName,'readwrite').put(row); req.onsuccess=()=>resolve(); req.onerror=reject; }); } catch(e){}
      }
      return rows;
    }
  } catch (e) { console.error('Cloud list failed:', storeName, e); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

async function dbDelete(storeName, key) {
  try {
    if (CLOUD_STORES.includes(storeName) && window.cloudDB) {
      await window.cloudDB.collection('appData').doc(storeName).collection('items').doc(cloudSafeId(key)).delete();
      try { await new Promise((resolve,reject)=>{ const req=tx(storeName,'readwrite').delete(key); req.onsuccess=()=>resolve(); req.onerror=reject; }); } catch(e){}
      return;
    }
  } catch (e) { console.error('Cloud delete failed:', storeName, e); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').delete(key);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}

async function dbGetByIndex(storeName, indexName, value) {
  const rows = await dbGetAll(storeName);
  if (indexName === 'status') return rows.filter(x => x.status === value);
  if (indexName === 'residentId') return rows.filter(x => String(x.residentId) === String(value));
  return rows;
}

// ---------- Simple password hashing (SHA-256 via Web Crypto) ----------
async function hashPassword(password) {
  const enc = new TextEncoder().encode(password);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- App state ----------
const state = {
  route: 'home',
  params: {},
  isAdmin: false,
  adminUser: null
};

function setRoute(route, params = {}) {
  state.route = route;
  state.params = params;
  window.scrollTo(0, 0);
  render();
  saveSessionToStorage();
}

function saveSessionToStorage() {
  sessionStorage.setItem('ct_session', JSON.stringify({ isAdmin: state.isAdmin, adminUser: state.adminUser }));
}
function loadSessionFromStorage() {
  const raw = sessionStorage.getItem('ct_session');
  if (raw) {
    try {
      const s = JSON.parse(raw);
      state.isAdmin = s.isAdmin;
      state.adminUser = s.adminUser;
    } catch (e) {}
  }
}

function requireAdmin() {
  if (!state.isAdmin) {
    setRoute('adminLogin');
    return false;
  }
  return true;
}

function showToast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===========================================================
// CREATIVE THEME ENGINE — scroll progress, parallax, spring
// reveal-on-scroll, magnetic buttons, count-up numbers.
// Purely additive: never touches app/state/data logic above.
// ===========================================================
function initScrollEffects() {
  // ---- Scroll progress bar + navbar elevation + light parallax ----
  const progressBar = document.getElementById('scrollProgress');
  function onScroll() {
    const doc = document.documentElement;
    const scrolled = doc.scrollTop || document.body.scrollTop;
    const max = doc.scrollHeight - doc.clientHeight;
    const pct = max > 0 ? (scrolled / max) * 100 : 0;
    if (progressBar) progressBar.style.width = pct + '%';

    const nav = document.querySelector('.navbar');
    if (nav) nav.classList.toggle('scrolled', scrolled > 12);

    const seal = document.querySelector('.seal-ring');
    if (seal) seal.style.marginTop = Math.max(-40, scrolled * -0.06) + 'px';
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // ---- Scroll-reveal for existing cards/sections (adds .reveal + .in-view) ----
  const revealSelector = [
    '.hero-eyebrow', '.hero h1', '.hero-lead', '.hero-ctas', '.hero-stats', '.hero-visual',
    '.section-head', '.program-card', '.feature-item', '.stat-card', '.address-card',
    '.form-card', '.kpi-card', '.card', '.login-card', '.profile-photo-card',
    '.footer-grid > div', '.map-frame', '.profile-table', '.contact-grid > div',
    '.location-grid > div', '.pill-list', 'table.data-table', '.empty-state'
  ].join(', ');

  const revealIO = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealIO.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  function scanReveals(root) {
    let i = 0;
    root.querySelectorAll(revealSelector).forEach(el => {
      if (el.dataset.revealBound) return;
      el.dataset.revealBound = '1';
      el.classList.add('reveal');
      el.style.transitionDelay = ((i % 6) * 70) + 'ms';
      revealIO.observe(el);
      i++;
    });
  }

  // ---- Count-up animation for stat/kpi numbers as they enter view ----
  const counterSelector = '.hero-stat .num, .kpi-card .kpi-value, .stat-card .value';
  const counterIO = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animateCountUp(entry.target);
        counterIO.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });

  function scanCounters(root) {
    root.querySelectorAll(counterSelector).forEach(el => {
      if (el.dataset.counterBound) return;
      el.dataset.counterBound = '1';
      counterIO.observe(el);
    });
  }

  function animateCountUp(el) {
    const raw = el.textContent.trim();
    const match = raw.match(/^([^\d]*)([\d,]+)(.*)$/);
    if (!match) return;
    const prefix = match[1], numStr = match[2], suffix = match[3];
    const target = parseInt(numStr.replace(/,/g, ''), 10);
    if (isNaN(target)) return;
    const duration = 1100;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const current = Math.round(target * eased);
      el.textContent = prefix + current.toLocaleString('en-IN') + suffix;
      if (p < 1) requestAnimationFrame(tick); else el.textContent = raw;
    }
    requestAnimationFrame(tick);
  }

  // ---- Gentle magnetic pull on primary buttons ----
  function initMagnetic(root) {
    root.querySelectorAll('.btn').forEach(btn => {
      if (btn.dataset.magnetic) return;
      btn.dataset.magnetic = '1';
      btn.addEventListener('mousemove', (e) => {
        const r = btn.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        btn.style.transform = `translate(${x * 0.12}px, ${y * 0.28}px)`;
      });
      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    });
  }

  scanReveals(document);
  scanCounters(document);
  initMagnetic(document);

  // ---- Re-scan + page-enter swoosh every time the SPA swaps routes ----
  const app = document.getElementById('app');
  if (app) {
    const mo = new MutationObserver(() => {
      scanReveals(app);
      scanCounters(app);
      initMagnetic(app);
      app.classList.remove('page-enter');
      void app.offsetWidth; // force reflow so the animation restarts
      app.classList.add('page-enter');
      onScroll();
    });
    mo.observe(app, { childList: true });
  }
}

async function render() {
  const app = document.getElementById('app');
  const r = state.route;

  if (r === 'home') return app.innerHTML = await viewHome();
  if (r === 'about') return app.innerHTML = await viewAbout();
  if (r === 'programs') return app.innerHTML = await viewPrograms();
  if (r === 'oldagehome') return app.innerHTML = await viewOldAgeHome();
  if (r === 'location') return app.innerHTML = await viewLocation();
  if (r === 'contact') { app.innerHTML = await viewContact(); attachContactFormHandler(); return; }

  if (r === 'adminLogin') { app.innerHTML = viewAdminLogin(); attachLoginHandler(); return; }
  if (r === 'adminLogout') { state.isAdmin = false; state.adminUser = null; saveSessionToStorage(); setRoute('home'); return; }

  if (r === 'dashboard') { if (!requireAdmin()) return; app.innerHTML = await viewDashboard(); return; }
  if (r === 'residents') { if (!requireAdmin()) return; app.innerHTML = await viewResidentsList(); attachResidentsListHandlers(); return; }
  if (r === 'residentNew') { if (!requireAdmin()) return; app.innerHTML = viewResidentForm(null); attachResidentFormHandler(null); return; }
  if (r === 'residentEdit') { if (!requireAdmin()) return; const resident = await dbGet('residents', Number(state.params.id)); app.innerHTML = viewResidentForm(resident); attachResidentFormHandler(resident); return; }
  if (r === 'residentView') { if (!requireAdmin()) return; app.innerHTML = await viewResidentDetail(Number(state.params.id)); attachResidentDetailHandlers(Number(state.params.id)); return; }
  if (r === 'food-menu') {
    if (!requireAdmin()) return;
    app.innerHTML = viewFoodMenu();
    cloudFoodLoad().then(menu => {
      if (menu) { localStorage.setItem('changeFoodMenu', JSON.stringify(menu)); app.innerHTML = viewFoodMenu(); }
    }).catch(e=>console.error('Cloud food load:',e));
    return;
  }
  if (r === 'calendar-events') {
    if (!requireAdmin()) return;
    app.innerHTML = viewCalendarEvents();
    cloudEventsLoad().then(items => {
      localStorage.setItem('changeEvents', JSON.stringify(items)); app.innerHTML = viewCalendarEvents();
    }).catch(e=>console.error('Cloud events load:',e));
    return;
  }
  if (r === 'messages') { if (!requireAdmin()) return; app.innerHTML = await viewMessages(); attachMessagesHandlers(); return; }
  if (r === 'database') { if (!requireAdmin()) return; app.innerHTML = await viewDatabase(); attachDatabaseHandlers(); return; }
  if (r === 'settings') { if (!requireAdmin()) return; app.innerHTML = await viewSettings(); attachSettingsHandler(); return; }

  app.innerHTML = view404();
}

    const adminSettings = await dbGet('settings', 'adminUser');
    const hash = await hashPassword(password);
    if (adminSettings && adminSettings.username === username && adminSettings.passwordHash === hash) {
      state.isAdmin = true;
      state.adminUser = adminSettings.fullName || username;
      saveSessionToStorage();
      setRoute('dashboard');
    } else {
      document.getElementById('loginAlertHost').innerHTML = `<div class="alert alert-error">Invalid username or password.</div>`;
    }
  });
}

function attachResidentFormHandler(resident) {

    if (photoFile) {
      try {
        photoDataUrl = await fileToDataURL(photoFile);
      } catch (err) {
        document.getElementById('formAlertHost').innerHTML = `<div class="alert alert-error">Could not read the photo file.</div>`;
        return;
      }
    }

    const data = {
      fullName: fd.get('fullName'), gender: fd.get('gender') || '', dateOfBirth: fd.get('dateOfBirth') || '',
      age: fd.get('age') || '', admissionDate: fd.get('admissionDate') || '', roomNumber: fd.get('roomNumber') || '',

      dietaryRequirements: fd.get('dietaryRequirements') || '', healthNotes: fd.get('healthNotes') || '',

      emergencyContactPhone: fd.get('emergencyContactPhone') || '', guardianAddress: fd.get('guardianAddress') || '',
      notes: fd.get('notes') || '', status: 'active'
    };

    try {

// ===========================================================
// ADMIN: Database (real SQLite via sql.js, separate from the
// IndexedDB-backed Residents feature). Lets the admin keep a
// portable .db file and export to Excel, and pull current
// Residents into it with one click.
// ===========================================================

let sqldbSQL = null;
let sqldb = null;
let sqldbSearch = '';
let sqldbLibraryLoading = null;

const SQLDB_SCHEMA = `
CREATE TABLE IF NOT EXISTS residents (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  full_name TEXT NOT NULL,
  gender TEXT,
  age INTEGER,
  date_of_birth TEXT,
  address TEXT,
  admission_date TEXT,
  room_number TEXT,
  aadhar_number TEXT,
  health_notes TEXT,
  emergency_contact_name TEXT,
  emergency_contact_relation TEXT,
  emergency_contact_phone TEXT NOT NULL,
  notes TEXT,
  created_at TEXT DEFAULT (datetime('now')),
  updated_at TEXT DEFAULT (datetime('now'))
);
`;

async function sqldbLoadLibrary() {
  if (sqldbSQL) return sqldbSQL;
  if (!sqldbLibraryLoading) {
    sqldbLibraryLoading = window.initSqlJs({
      locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    }).then(SQL => { sqldbSQL = SQL; return SQL; });
  }
  return sqldbLibraryLoading;
}

function sqldbNewEmpty() {
  sqldb = new sqldbSQL.Database();
  sqldb.run(SQLDB_SCHEMA);
}

function sqldbLoadFromBytes(bytes) {
  sqldb = new sqldbSQL.Database(bytes);
  sqldb.run(SQLDB_SCHEMA);
}

function sqldbGetAll(search) {
  let sql = 'SELECT * FROM residents';
  const params = [];
  if (search) { sql += ' WHERE full_name LIKE ?'; params.push('%' + search + '%'); }
  sql += ' ORDER BY full_name';
  const stmt = sqldb.prepare(sql);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function sqldbGetOne(id) {
  const stmt = sqldb.prepare('SELECT * FROM residents WHERE id = ?');
  stmt.bind([id]);
  let row = null;
  if (stmt.step()) row = stmt.getAsObject();
  stmt.free();
  return row;
}


async function sqldbCloudSaveAll() {
  if (!window.cloudDB || !sqldb) return;
  const records = sqldbGetAll('');
  await window.cloudDB.collection('siteData').doc('residentDatabase').set({records, updatedAt: Date.now()});
}
async function sqldbCloudLoadAll() {
  if (!window.cloudDB) return;
  const snap = await window.cloudDB.collection('siteData').doc('residentDatabase').get();
  if (!snap.exists) return;
  const records = snap.data().records || [];
  if (!sqldb) return;
  sqldb.run('DELETE FROM residents');
  records.forEach(r => {
    sqldb.run(`INSERT INTO residents
      (id, full_name, gender, age, date_of_birth, address, admission_date, room_number, aadhar_number, health_notes,
       emergency_contact_name, emergency_contact_relation, emergency_contact_phone, notes, created_at, updated_at)
      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
      [r.id,r.full_name,r.gender,r.age,r.date_of_birth,r.address,r.admission_date,r.room_number,r.aadhar_number,
       r.health_notes,r.emergency_contact_name,r.emergency_contact_relation,r.emergency_contact_phone,r.notes,
       r.created_at||'',r.updated_at||'']);
  });
}

function sqldbInsert(d) {
  sqldb.run(`INSERT INTO residents
    (full_name, gender, age, date_of_birth, address, admission_date, room_number, aadhar_number, health_notes,
     emergency_contact_name, emergency_contact_relation, emergency_contact_phone, notes)
    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`,
    [d.full_name, d.gender, d.age, d.date_of_birth, d.address, d.admission_date, d.room_number,
     d.aadhar_number, d.health_notes, d.emergency_contact_name, d.emergency_contact_relation,
     d.emergency_contact_phone, d.notes]);
  sqldbCloudSaveAll().catch(console.error);
}

function sqldbUpdate(id, d) {
  sqldb.run(`UPDATE residents SET full_name=?, gender=?, age=?, date_of_birth=?, address=?, admission_date=?,
    room_number=?, aadhar_number=?, health_notes=?, emergency_contact_name=?, emergency_contact_relation=?,
    emergency_contact_phone=?, notes=?, updated_at=datetime('now') WHERE id=?`,
    [d.full_name, d.gender, d.age, d.date_of_birth, d.address, d.admission_date, d.room_number,
     d.aadhar_number, d.health_notes, d.emergency_contact_name, d.emergency_contact_relation,
     d.emergency_contact_phone, d.notes, id]);
  sqldbCloudSaveAll().catch(console.error);
}

function sqldbDelete(id) {
  sqldb.run('DELETE FROM residents WHERE id = ?', [id]);
  sqldbCloudSaveAll().catch(console.error);
}

}

function sqldbRenderAll() {
  sqldbRenderKpis();
  sqldbRenderTable();
}

function sqldbRenderKpis() {
  const all = sqldbGetAll('');
  document.getElementById('sqldbKpiTotal').textContent = all.length;
  document.getElementById('sqldbKpiMale').textContent = all.filter(r => r.gender === 'Male').length;
  document.getElementById('sqldbKpiFemale').textContent = all.filter(r => r.gender === 'Female').length;
  const ages = all.map(r => Number(r.age)).filter(a => !isNaN(a) && a > 0);
  document.getElementById('sqldbKpiAge').textContent = ages.length ? Math.round(ages.reduce((a,b)=>a+b,0)/ages.length) : '-';
}

function sqldbRenderTable() {
  const rows = sqldbGetAll(sqldbSearch);

function sqldbConfirmDelete(id) {
  const r = sqldbGetOne(id);
  if (!confirm(`Remove ${r.full_name} from this database? This cannot be undone (unless you have an earlier saved .db file).`)) return;
  sqldbDelete(id);
  sqldbRenderAll();
  showToast('Record removed.');
}

function sqldbSave() {
  const bytes = sqldb.export();
  const blob = new Blob([bytes], { type: 'application/x-sqlite3' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'change-trust-residents.db';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Database file downloaded. Keep this file safe.');
}

function sqldbExportExcel() {
  const rows = sqldbGetAll('').map(r => ({
    'ID': r.id, 'Full Name': r.full_name, 'Gender': r.gender || '', 'Age': r.age || '',
    'Date of Birth': r.date_of_birth || '', 'Address': r.address || '', 'Admission Date': r.admission_date || '',
    'Room Number': r.room_number || '', 'Aadhar / ID Number': r.aadhar_number || '',
    'Health Notes': r.health_notes || '', 'Emergency Contact Name': r.emergency_contact_name || '',
    'Relation': r.emergency_contact_relation || '', 'Emergency Contact Number': r.emergency_contact_phone || '',
    'Other Notes': r.notes || ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:22},{wch:10},{wch:6},{wch:14},{wch:28},{wch:14},{wch:10},{wch:16},{wch:28},{wch:18},{wch:12},{wch:18},{wch:28}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Residents');
  XLSX.writeFile(wb, 'change-trust-residents.xlsx');
  showToast('Excel file downloaded.');
}

async function sqldbImportFromResidents() {
  const residents = (await dbGetAll('residents')).filter(r => r.status === 'active');
  if (residents.length === 0) {
    showToast('No residents found in the Residents list to import.');
    return;
  }
  if (!confirm(`Import ${residents.length} resident(s) from the Residents list into this database? Existing database records will not be removed.`)) return;

  residents.forEach(r => {
    sqldbInsert({
      full_name: r.fullName, gender: r.gender || '', age: r.age || null, date_of_birth: r.dateOfBirth || '',
      address: r.guardianAddress || '', admission_date: r.admissionDate || '', room_number: r.roomNumber || '',
      aadhar_number: r.aadharNumber || '', health_notes: r.healthNotes || '',
      emergency_contact_name: r.emergencyContactName || '', emergency_contact_relation: r.emergencyContactRelation || '',
      emergency_contact_phone: r.emergencyContactPhone || '', notes: r.notes || ''
    });
  });
  sqldbRenderAll();
  sqldbSetStatus(`Imported ${residents.length} resident(s) from the Residents list.`, true);
  showToast('Import complete.');
}

function attachDatabaseHandlers() {
  document.getElementById('sqldbAddBtn').addEventListener('click', sqldbOpenAdd);
  document.getElementById('sqldbCancelBtn').addEventListener('click', sqldbCloseModal);
  document.getElementById('sqldbModalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'sqldbModalBackdrop') sqldbCloseModal(); });

  document.getElementById('sqldbForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('sqldb_id').value;
    const data = {
      full_name: document.getElementById('sqldb_name').value.trim(),
      gender: document.getElementById('sqldb_gender').value,
      age: document.getElementById('sqldb_age').value || null,
      date_of_birth: document.getElementById('sqldb_dob').value,
      address: document.getElementById('sqldb_address').value.trim(),
      admission_date: document.getElementById('sqldb_admission').value,
      room_number: document.getElementById('sqldb_room').value.trim(),
      aadhar_number: document.getElementById('sqldb_aadhar').value.trim(),
      health_notes: document.getElementById('sqldb_health').value.trim(),
      emergency_contact_name: document.getElementById('sqldb_ec_name').value.trim(),
      emergency_contact_relation: document.getElementById('sqldb_ec_relation').value.trim(),
      emergency_contact_phone: document.getElementById('sqldb_ec_phone').value.trim(),
      notes: document.getElementById('sqldb_notes').value.trim()
    };
    if (id) sqldbUpdate(Number(id), data); else sqldbInsert(data);
    sqldbCloseModal();
    sqldbRenderAll();
    showToast(id ? 'Record updated.' : 'Record added.');
  });

  document.getElementById('sqldbSearchInput').addEventListener('input', (e) => {
    sqldbSearch = e.target.value;
    sqldbRenderTable();
  });

  document.getElementById('sqldbSaveBtn').addEventListener('click', sqldbSave);
  document.getElementById('sqldbExcelBtn').addEventListener('click', sqldbExportExcel);
  document.getElementById('sqldbImportBtn').addEventListener('click', sqldbImportFromResidents);

  document.getElementById('sqldbLoadBtn').addEventListener('click', () => document.getElementById('sqldbLoadInput').click());
  document.getElementById('sqldbLoadInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    try {
      sqldbLoadFromBytes(new Uint8Array(buf));
      sqldbSetStatus(`Loaded "${file.name}" successfully.`, true);
      sqldbRenderAll();
    } catch (err) {
      showToast('Could not open that file as a database: ' + err.message);
    }
    e.target.value = '';
  });

  sqldbRenderAll();
}

          If you change the username or password, you'll use the new ones next time you log in &mdash;
          this session will stay logged in until you log out.
        </p>
      </div>
    </div>
  </div>`;
}

function attachSettingsHandler() {
  const form = document.getElementById('settingsForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertHost = document.getElementById('settingsAlertHost');
    alertHost.innerHTML = '';

    const fullName = document.getElementById('set_fullName').value.trim();
    const username = document.getElementById('set_username').value.trim();
    const currentPassword = document.getElementById('set_currentPassword').value;
    const newPassword = document.getElementById('set_newPassword').value;
    const confirmPassword = document.getElementById('set_confirmPassword').value;

    if (!username) {
      alertHost.innerHTML = `<div class="alert alert-error">Username cannot be empty.</div>`;
      return;
    }

    const adminSettings = await dbGet('settings', 'adminUser');
    const currentHash = await hashPassword(currentPassword);
    if (currentHash !== adminSettings.passwordHash) {
      alertHost.innerHTML = `<div class="alert alert-error">Current password is incorrect.</div>`;
      return;
    }

    if (newPassword || confirmPassword) {
      if (newPassword.length < 6) {
        alertHost.innerHTML = `<div class="alert alert-error">New password must be at least 6 characters.</div>`;
        return;
      }
      if (newPassword !== confirmPassword) {
        alertHost.innerHTML = `<div class="alert alert-error">New password and confirmation do not match.</div>`;
        return;
      }
    }

    const updated = {
      key: 'adminUser',
      username,
      fullName: fullName || username,
      passwordHash: newPassword ? await hashPassword(newPassword) : adminSettings.passwordHash
    };
    await dbPut('settings', updated);

    state.adminUser = updated.fullName;
    saveSessionToStorage();

    document.getElementById('set_currentPassword').value = '';
    document.getElementById('set_newPassword').value = '';
    document.getElementById('set_confirmPassword').value = '';

    alertHost.innerHTML = `<div class="alert alert-success">Settings updated successfully.</div>`;
    showToast('Account settings saved.');
  });
}

async function exportResidentPdf(id) {
  const resident = await dbGet('residents', id);
  if (!resident) return;
  let logs = await dbGetByIndex('logs', 'residentId', id);
  logs.sort((a, b) => b.logDate.localeCompare(a.logDate));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 50;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(26, 107, 60);
  doc.text('CENTRE FOR HEALTH & GENDER EQUALITY (CHANGE)', pageWidth / 2, y, { align: 'center' });
  y += 18;
  doc.setFontSize(10);
  doc.setTextColor(80, 80, 80);
  doc.setFont('helvetica', 'normal');
  doc.text('Tirupattur - 635601, Tamil Nadu', pageWidth / 2, y, { align: 'center' });
  y += 26;
  doc.setFontSize(13);
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'bold');
  doc.text('Resident Profile & Care Report', pageWidth / 2, y, { align: 'center' });
  y += 30;

  doc.setFontSize(11);
  const fields = [
    ['Name', resident.fullName], ['Gender', resident.gender], ['Date of Birth', resident.dateOfBirth],
    ['Age', resident.age], ['Admission Date', resident.admissionDate], ['Room Number', resident.roomNumber],
    ['Mobility Status', resident.mobilityStatus], ['Dietary Requirements', resident.dietaryRequirements],
    ['Medical Conditions', resident.medicalConditions], ['Medications', resident.medications],
    ['Health Notes', resident.healthNotes],
    ['Emergency Contact', `${resident.emergencyContactName || ''} (${resident.emergencyContactRelation || ''}) - ${resident.emergencyContactPhone || ''}`],
    ['Guardian Address', resident.guardianAddress]
  ];

  fields.forEach(([label, value]) => {
    const text = `${label}: ${value || '-'}`;
    const lines = doc.splitTextToSize(text, pageWidth - 100);
    doc.setFont('helvetica', 'bold');
    doc.text(label + ':', 50, y);
    doc.setFont('helvetica', 'normal');
    const valueLines = doc.splitTextToSize(String(value || '-'), pageWidth - 180);
    doc.text(valueLines, 175, y);
    y += 16 * valueLines.length;
    if (y > 760) { doc.addPage(); y = 50; }
  });

  y += 14;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('Activity / Care Logs', 50, y);
  y += 20;

  if (logs.length === 0) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.text('No logs recorded yet.', 50, y);
    y += 16;
  } else {
    logs.forEach(log => {
      if (y > 760) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text(`${log.logDate} — ${log.logType}`, 50, y);
      y += 14;
      doc.setFont('helvetica', 'normal');
      const descLines = doc.splitTextToSize(log.description, pageWidth - 100);
      doc.text(descLines, 50, y);
      y += 14 * descLines.length + 6;
    });
  }

  doc.setFontSize(9);
  doc.setTextColor(140, 140, 140);
  doc.text(`Generated on ${new Date().toLocaleString('en-IN')}`, pageWidth - 50, 820, { align: 'right' });

  doc.save(`resident-${resident.id}-${resident.fullName.replace(/\s+/g,'_')}-report.pdf`);
}

async function exportAllResidentsExcel() {
  const residents = (await dbGetAll('residents')).filter(r => r.status === 'active');
  const rows = residents.map(r => ({
    ID: r.id, 'Full Name': r.fullName, Gender: r.gender || '', Age: r.age || '',
    'Date of Birth': r.dateOfBirth || '', 'Admission Date': r.admissionDate || '',
    Room: r.roomNumber || '', 'Mobility Status': r.mobilityStatus || '',
    'Medical Conditions': r.medicalConditions || '', Medications: r.medications || '',
    'Emergency Contact': r.emergencyContactName || '', 'Emergency Phone': r.emergencyContactPhone || ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Residents');
  XLSX.writeFile(wb, 'residents-report.xlsx');
}

async function exportLogsExcel(residentId) {

  logs.sort((a, b) => b.logDate.localeCompare(a.logDate));

}
